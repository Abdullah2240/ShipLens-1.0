name: CI

# Gates every pushed branch and every pull request to main. Branch protection requires
# the single aggregate check `ci-ok`. No secrets are used: the database credentials are
# throwaway values for disposable CI containers, and the E2E demo password is generated
# per run and masked.
#
# Every third-party action is pinned to a full commit SHA (version in the trailing
# comment) and the secret-scan image to a tag plus digest; Dependabot proposes action
# updates weekly.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Permissions doc drift
        run: npm run permissions:check
      - name: i18n parity
        run: npm run i18n:check
      - name: Unit tests
        run: npm test

  database:
    name: database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway values for this disposable CI container only.
          POSTGRES_USER: shiplens
          POSTGRES_PASSWORD: shiplens
          POSTGRES_DB: shiplens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shiplens -d shiplens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Migrate from empty
        env:
          DATABASE_URL: postgres://shiplens:shiplens@localhost:5432/shiplens
        run: |
          node scripts/migrate.mjs
          second="$(node scripts/migrate.mjs)"
          echo "$second"
          if ! grep -q 'No pending migrations' <<<"$second"; then
            echo '::error::A second migrate run applied migrations again; migrations are not idempotent.'
            exit 1
          fi
      - name: Tests with coverage
        env:
          TEST_DATABASE_URL: postgres://shiplens:shiplens@localhost:5432/shiplens_test
        run: npm run test:coverage
      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No service container: compose.e2e.yaml brings its own tmpfs database.
    env:
      E2E_PROJECT: shiplens-e2e-ci
      E2E_PORT: '3100'
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # scripts/e2e-docker.mjs and scripts/smoke.mjs use Node built-ins only: no npm ci.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Generate a per-run demo password
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "E2E_DEMO_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Build the production image and start the stack
        run: npm run e2e:up
      - name: Smoke
        run: |
          SKIP=""
          [ -f "src/app/[locale]/(auth)/login/page.tsx" ] || SKIP="pages"
          BASE_URL="http://localhost:$E2E_PORT" SMOKE_DEMO_PASSWORD="$E2E_DEMO_PASSWORD" \
            node scripts/smoke.mjs ${SKIP:+--skip "$SKIP"}
      # DEP-04: CSP nonce, HSTS, framing, sniffing, referrer, permissions, COOP/CORP and
      # API headers checked against the real production image.
      - name: Security headers
        run: BASE_URL="http://localhost:$E2E_PORT" node scripts/check-headers.mjs
      - name: App container runs as a non-root user
        run: |
          uid="$(docker compose -f compose.e2e.yaml -p "$E2E_PROJECT" exec -T app id -u)"
          echo "app uid: $uid"
          if [ -z "$uid" ] || [ "$uid" = "0" ]; then
            echo '::error::The production image runs as root.'
            exit 1
          fi
      # Pristine specs assert exact seeded figures, so they run first on the freshly
      # seeded stack; later specs change data.
      - name: Playwright (pristine specs)
        run: npm run e2e:run -- --grep @pristine --pass-with-no-tests
      - name: Playwright (all other specs)
        run: npm run e2e:run -- --grep-invert @pristine
      - name: App log
        if: failure()
        run: docker compose -f compose.e2e.yaml -p "$E2E_PROJECT" logs app --tail 300
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Tear down the stack
        if: always()
        run: npm run e2e:down

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: every commit reachable from the tested ref is scanned.
          fetch-depth: 0
          persist-credentials: false
      - name: Secret scan over the full history
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --config /repo/.gitleaks.toml --redact --exit-code 1 --no-banner

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Install scripts are not needed to read the dependency tree.
      - run: npm ci --ignore-scripts
      - name: Production dependencies have no high or critical advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Full audit report (informational)
        if: ${{ !cancelled() }}
        run: |
          npm audit --json > audit.json || true
          npm audit --omit=dev --json > audit-prod.json || true
          node - <<'JS'
            const fs = require("node:fs");
            const count = (f) => {
              try { return JSON.parse(fs.readFileSync(f, "utf8")).metadata.vulnerabilities; }
              catch { return null; }
            };
            const line = (label, v) => v
              ? `| ${label} | ${v.critical} | ${v.high} | ${v.moderate} | ${v.low} | ${v.total} |`
              : `| ${label} | report unreadable | | | | |`;
            const out = [
              "### npm audit",
              "",
              "| Scope | Critical | High | Moderate | Low | Total |",
              "| --- | --- | --- | --- | --- | --- |",
              line("production", count("audit-prod.json")),
              line("all (incl. dev)", count("audit.json")),
              "",
              "Only high or critical advisories in production dependencies fail this job.",
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out.join("\n") + "\n");
          JS

  honesty:
    name: honesty
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so commit messages are scanned, not only the tip commit.
          fetch-depth: 0
          persist-credentials: false
      # Both scripts use Node built-ins only: no npm ci.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Tool names appear only in the disclosure file
        run: node scripts/check-tool-mentions.mjs
      # docs/api.md must match the route files; regenerate it with
      # `node scripts/gen-api-doc.mjs`. The permissions doc drift check runs in `static`.
      - name: api doc drift
        run: node scripts/gen-api-doc.mjs --check

  ci-ok:
    name: ci-ok
    needs: [static, database, e2e, secrets, audit, honesty]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          STATIC: ${{ needs.static.result }}
          DATABASE: ${{ needs.database.result }}
          E2E: ${{ needs.e2e.result }}
          SECRETS: ${{ needs.secrets.result }}
          AUDIT: ${{ needs.audit.result }}
          HONESTY: ${{ needs.honesty.result }}
        run: |
          echo "static=$STATIC database=$DATABASE e2e=$E2E secrets=$SECRETS audit=$AUDIT honesty=$HONESTY"
          for result in "$STATIC" "$DATABASE" "$E2E" "$SECRETS" "$AUDIT" "$HONESTY"; do
            if [ "$result" != "success" ]; then
              echo '::error::At least one required job did not succeed.'
              exit 1
            fi
          done
