name: shiplens

# Local development database. Credentials are throwaway local defaults, not secrets.
# Host port 5434 (5433 is commonly taken by other local Postgres containers).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: shiplens
      POSTGRES_PASSWORD: shiplens
      POSTGRES_DB: shiplens
    ports:
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shiplens -d shiplens']
      interval: 3s
      timeout: 3s
      retries: 20

  # The `full` profile runs the production image against the dev database:
  #   docker compose --profile full up -d --build --wait
  # Parallel work uses the isolated E2E stack (compose.e2e.yaml) instead.
  app:
    profiles: ['full']
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgres://shiplens:shiplens@db:5432/shiplens
      APP_ORIGIN: http://localhost:3000
      SEED_ON_BOOT: 'true'
      # Throwaway local value; override from the shell. Production sets its own secret.
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-local-demo-only-pass}
      LOG_LEVEL: info

volumes:
  pgdata:
