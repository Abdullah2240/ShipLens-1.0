name: shiplens

# Local development database. Credentials are throwaway local defaults, not secrets.
# Host port 5434 (5433 is commonly taken by other local Postgres containers).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: shiplens
      POSTGRES_PASSWORD: shiplens
      POSTGRES_DB: shiplens
    ports:
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shiplens -d shiplens']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
